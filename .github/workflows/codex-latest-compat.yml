name: Latest Codex compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1'

permissions:
  contents: read

jobs:
  portable-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve release through its fixed provenance asset
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          release_ref=$(python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('bootstrap/codex/manifest.json').read_text())
          value = manifest.get('baseline', {}).get('bundle_release_ref')
          if not isinstance(value, str) or not value:
              raise SystemExit('bundle_release_ref is not published')
          print(value)
          PY
          )
          mkdir -p "${RUNNER_TEMP}/release-provenance"
          gh release download "${release_ref}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "drclaw-${release_ref}.provenance.json" \
            --dir "${RUNNER_TEMP}/release-provenance"
          expected_commit=$(RELEASE_REF="${release_ref}" python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          release_ref = os.environ['RELEASE_REF']
          path = Path(os.environ['RUNNER_TEMP']) / 'release-provenance' / f'drclaw-{release_ref}.provenance.json'
          payload = json.loads(path.read_text())
          commit = payload.get('commit')
          if payload.get('schema_version') != 1 or payload.get('tag') != release_ref:
              raise SystemExit('release provenance identity mismatch')
          if not isinstance(commit, str) or re.fullmatch(r'[0-9a-f]{40}', commit) is None:
              raise SystemExit('release provenance has no valid full commit')
          print(commit)
          PY
          )
          remote_refs=$(git ls-remote --exit-code origin \
            "refs/tags/${release_ref}" "refs/tags/${release_ref}^{}")
          remote_commit=$(printf '%s\n' "${remote_refs}" | awk -v tag="refs/tags/${release_ref}^{}" \
            '$2 == tag { print $1 }')
          if [[ -z "${remote_commit}" ]]; then
            remote_commit=$(printf '%s\n' "${remote_refs}" | awk -v tag="refs/tags/${release_ref}" \
              '$2 == tag { print $1 }')
          fi
          test "${remote_commit}" = "${expected_commit}"
          git fetch --depth=1 origin "${expected_commit}" \
            "refs/tags/${release_ref}:refs/tags/${release_ref}"
          test "$(git rev-parse "${release_ref}^{commit}")" = "${expected_commit}"
          git checkout --detach "${expected_commit}"
          test -z "$(git status --porcelain --untracked-files=all)"
          printf 'release_ref=%s\n' "${release_ref}" >> "${GITHUB_OUTPUT}"
          printf 'expected_commit=%s\n' "${expected_commit}" >> "${GITHUB_OUTPUT}"

      - name: Use Python 3.9
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.9'

      - name: Install current official Codex
        run: |
          set -Eeuo pipefail
          curl -fsSL https://chatgpt.com/codex/install.sh -o "${RUNNER_TEMP}/codex-install.sh"
          sh "${RUNNER_TEMP}/codex-install.sh"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          "${HOME}/.local/bin/codex" --version

      - name: Install Dr. Claw into an isolated profile
        run: |
          set -Eeuo pipefail
          test_home="${RUNNER_TEMP}/drclaw-compat-home"
          mkdir -m 700 "${test_home}"
          python3 bootstrap/codex/bootstrap.py install \
            --home "${test_home}" \
            --codex-home "${test_home}/.codex" \
            --skip-delta-skill \
            --config-profile safe \
            --no-doctor

      - name: Verify current Codex contracts
        run: |
          set -Eeuo pipefail
          test_home="${RUNNER_TEMP}/drclaw-compat-home"
          python3 bootstrap/codex/bootstrap.py doctor \
            --home "${test_home}" \
            --codex-home "${test_home}/.codex" \
            --skip-delta-skill \
            --require-clean-native-skills \
            --strict-release \
            --json | tee "${RUNNER_TEMP}/codex-compat-report.json"

      - name: Upload compatibility receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-compatibility-receipt-${{ steps.release.outputs.expected_commit }}
          path: ${{ runner.temp }}/codex-compat-report.json
          if-no-files-found: warn
