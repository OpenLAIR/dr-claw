# CI: npm ci, client regressions, typecheck, build — PR must be green to merge
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20']
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: npm ci
        run: npm ci

      - name: Electron preload and service worker regressions
        run: node --test test/electron-preload.test.mjs test/service-worker.test.mjs

      - name: Unit tests
        run: npm test

      - name: Install Chromium for loading regressions
        run: npx playwright install --with-deps chromium

      - name: Browser loading regressions
        run: node --test test/lazy-loading.test.mjs

      - name: typecheck
        run: npm run typecheck

      - name: build
        run: npm run build
